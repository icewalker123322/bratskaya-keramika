<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="same-origin"><title>Управление — Братская керамика</title><link rel="stylesheet" href="admin.css"></head>
<body><div id="notice" role="status" aria-live="polite"></div>
<main id="login" class="login"><a href="../" class="brand">◒ Братская керамика</a><p class="muted">ПРОСТРАНСТВО ВЛАДЕЛЬЦА</p><h1>Добро пожаловать<br>в мастерскую</h1><p>Войдите, чтобы обновить тексты и фотографии сайта.</p><form id="login-form"><label>Логин<input name="login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Войти в панель →</button></form><p id="connection" class="muted">Проверяем подключение…</p><a href="../">← Вернуться на сайт</a></main>
<div id="workspace" hidden><aside><a href="../" class="brand">◒ Братская<br>керамика</a><p class="muted">Управление сайтом</p><nav aria-label="Управление"><button data-view="home">Обзор</button><button data-view="pages">Страницы</button><button data-view="photos">Фотографии</button><button data-view="settings">Настройки</button></nav><div class="aside-bottom"><a href="../" target="_blank" rel="noopener">Открыть сайт ↗</a><small id="account"></small><button id="logout" class="secondary">Выйти</button></div></aside><main class="content"><header><div><p class="muted">Братская керамика / Управление</p><h1 id="view-title">Обзор</h1></div><span class="status">Сайт мастерской</span></header><section id="view"></section></main></div>
<dialog id="editor"><form id="edit-form"><header><h2 id="edit-title">Редактирование</h2><button type="button" id="close-editor" class="secondary" aria-label="Закрыть">×</button></header><div id="fields"></div><footer><button type="button" id="cancel" class="secondary">Отмена</button><button type="submit">Сохранить</button></footer></form></dialog>
<script src="../cms-config.js"></script><script type="module" src="admin.js"></script></body></html>
